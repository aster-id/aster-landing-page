/* ── Base --- */
html,
body {
  margin: 0;
  padding: 0;
  background: var(--violet);

}

  border-radius: 2px;
}

  color: var(--paper);
}

/* ── Keyframes --- */
@keyframes rise {

  to {

  }

/* ── Layout --- */
.page {

}

  color: var(--violet);
}

  padding: 12px 16px;
  background: var(--violet);
  color: var(--paper);
  transform: translateY(-150%);
}
.site-header .skip-link:focus-visible {

}

}

.middle {

  gap: clamp(32px, 4vw, 80px);
}
.hero {

  align-items: flex-start;

}
.stack {

  flex-direction: column;

}

/* ── Hero: shared --- */

  width: min(100%, 13.5ch);

}

  letter-spacing: var(--type-lead-tracking);

}

/* ── Hero: balanced variant --- */
.headline--balanced {

}
.intro--balanced {
  margin: 32px 0 0;

}

/* ── Hero: handle-first variant --- */
.headline--handle {
  margin: 24px 0 0;

  color: var(--paper);

}

  margin: 26px 0 0;

}

/* ── Hero: type-only variant --- */
.eyebrow {

/* ── ID card --- */
.id-card {
  min-width: 0;
  padding: clamp(36px, 3vw, 48px);
  border: 1px solid rgba(247, 245, 241, 0.4);

.card-header {

.cycle-toggle {

  right: 0;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid rgba(var(--paper-rgb), 0.6);
  border-radius: 50%;
  background: transparent;
  color: var(--paper);
  font-size: 18px;
  clip-path: inset(50%);
  pointer-events: none;
}
.cycle-toggle:focus-visible {
  clip-path: none;
  pointer-events: auto;
  outline: 2px solid var(--paper);
  outline-offset: 3px;
}
.cycle-toggle[hidden] {
  display: none;
}
.handle-line {
  display: flex;
  justify-content: center;
  margin: 0;
  color: var(--handle-gold);
  font: var(--type-code);

  font-size: clamp(16px, min(var(--type-heading-1-size), 8.5cqi), var(--font-size-3xl));

}
.handle-name {
  flex: 0 0 auto;
  text-align: right;
}
.card-divider {
  height: 1px;
  margin: 24px 0 20px;
  background: rgba(var(--paper-rgb), 0.38);
}
.card-placeholder {
  display: grid;
  gap: 10px;
}
.card-placeholder-line {
  display: block;
  width: 95%;
  height: 8px;
  background: rgba(var(--paper-rgb), 0.28);
}
.card-placeholder-line:nth-child(2) {

}

}

}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;

  white-space: nowrap;

}
.input {

}

}

}
.button {

  background: var(--paper);
  color: var(--violet);

  letter-spacing: var(--type-label-default-tracking);

}
.button:hover {
  background: var(--lavender);
  border-color: var(--lavender);
  color: var(--violet-ink);
}
.error {
  margin: 0;
  min-height: 18px;

.tagline {
