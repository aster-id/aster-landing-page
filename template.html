<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#4A357E" />
    <script src="./support.js" defer></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <title>%%PAGE_TITLE%%</title>
        <meta name="description" content="%%META_DESCRIPTION|attr%%" />
        <link rel="canonical" href="%%DOMAIN|attr%%" />
        <meta property="og:url" content="%%DOMAIN|attr%%" />
        <meta property="og:title" content="%%OG_TITLE|attr%%" />
        <meta property="og:description" content="%%OG_DESCRIPTION|attr%%" />
        <meta property="og:image" content="%%DOMAIN|attr%%uploads/og-image.png" />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="%%DOMAIN|attr%%uploads/og-image.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="uploads/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="uploads/favicon-16.png" />
        <link rel="apple-touch-icon" href="uploads/apple-touch-icon.png" />
        <style>
          %%CSS%%
        </style>
      </helmet>
      <!-- Copy & config: content.md · styles: styles.css · structure: template.html · rebuild: npm run build -->
      <div class="page">
        <header class="site-header">
          <a class="brand" href="./" aria-label="Aster ID home">
            <img class="brand-lockup" src="uploads/aster-lockup.svg" alt="Aster ID" width="800" height="205" />
          </a>
          <nav class="header-nav" aria-label="Main navigation">
            <a class="about-link" href="about.html">%%ABOUT_LABEL%%</a>
            <a class="about-link" href="faq.html">FAQ</a>
          </nav>
        </header>

        <main class="middle">
          <div class="hero-layout">
            <div class="hero">
              <p class="eyebrow hero-eyebrow">%%EYEBROW%%</p>
              <sc-if value="{{ isBalanced }}" hint-placeholder-val="{{ true }}">
                <div class="stack">
                  <h1 class="headline headline--balanced">%%HEADLINE%%</h1>
                  <p class="intro intro--balanced">%%BODY%%</p>
                </div>
              </sc-if>

              <sc-if value="{{ isHandleFirst }}">
                <div class="stack">
                  <h1 class="headline headline--handle">%%HEADLINE%%</h1>
                  <p class="intro intro--handle">%%BODY%%</p>
                </div>
              </sc-if>

              <sc-if value="{{ isTypeOnly }}">
                <div class="stack">
                  <div class="rule"></div>
                  <h1 class="headline headline--type">%%HEADLINE%%</h1>
                  <p class="intro intro--type">%%BODY%%</p>
                </div>
              </sc-if>

              <div class="signup">
                <form class="signup-form" action="%%LEAFLET_SUBSCRIBE_URL|attr%%" method="get" onSubmit="{{ onSubmit }}" novalidate="{{ true }}">
                  <input type="hidden" name="action" value="%%LEAFLET_SUBSCRIBE_ACTION|attr%%" />
                  <input type="hidden" name="redirect" value="%%LEAFLET_REDIRECT_URL|attr%%" />
                  <div class="signup-row">
                    <label for="aster-email" class="visually-hidden">%%EMAIL_LABEL%%</label>
                    <input
                      class="input"
                      id="aster-email"
                      name="email"
                      type="email"
                      autocomplete="email"
                      placeholder="%%EMAIL_PLACEHOLDER|attr%%"
                      value="{{ email }}"
                      onChange="{{ onEmailChange }}"
                      aria-invalid="{{ invalid }}"
                      aria-describedby="aster-email-error"
                    />
                    <button class="button" type="submit">%%SUBMIT_BUTTON%%</button>
                  </div>
                  <p class="error" id="aster-email-error" role="status">{{ error }}</p>
                </form>
              </div>

              <p class="tagline">%%TAGLINE%%</p>
            </div>
            <aside class="id-card" aria-label="Example Aster ID">
              <p class="card-eyebrow">An Aster ID</p>
              <p class="handle-line" onMouseEnter="{{ pauseCycle }}" onMouseLeave="{{ resumeCycle }}">
                <span class="handle-name" style="{{ handleStyle }}">{{ handleName }}</span><span>%%HANDLE_SUFFIX%%</span>
              </p>
              <div class="card-divider" aria-hidden="true"></div>
              <div class="card-placeholder" aria-hidden="true">
                <span class="card-placeholder-line"></span>
                <span class="card-placeholder-line"></span>
                <span class="card-placeholder-line"></span>
              </div>
            </aside>
          </div>
        </main>

        <footer class="footer">
          <p class="footer-note">
            An <a class="footer-link" href="%%FOOTER_LINK_1_HREF|attr%%">%%FOOTER_LINK_1_LABEL%%</a> project, fiscally hosted by the
            <a class="footer-link" href="%%FOOTER_LINK_2_HREF|attr%%">%%FOOTER_LINK_2_LABEL%%</a>.
          </p>
          <nav class="footer-legal" aria-label="Legal">
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
          </nav>
          <div class="social">
            <a class="social-link social-link--image" href="%%BLOG_URL|attr%%" target="_blank" rel="noopener" aria-label="Aster ID blog" title="Blog">
              <img src="uploads/leaflet-favicon.png" alt="" width="96" height="96" />
            </a>
            <a class="social-link" href="%%BLUESKY_URL|attr%%" target="_blank" rel="noopener" aria-label="Aster ID on Bluesky" title="Bluesky">
              <svg viewBox="0 0 16 16" width="19" height="19" fill="currentColor" aria-hidden="true" focusable="false">
                <path
                  d="M3.468 1.948C5.303 3.325 7.276 6.118 8 7.616c.725-1.498 2.698-4.29 4.532-5.668C13.855.955 16 .186 16 2.632c0 .489-.28 4.105-.444 4.692-.572 2.04-2.653 2.561-4.504 2.246 3.236.551 4.06 2.375 2.281 4.2-3.376 3.464-4.852-.87-5.23-1.98-.07-.204-.103-.3-.103-.218 0-.081-.033.014-.102.218-.379 1.11-1.855 5.444-5.231 1.98-1.778-1.825-.955-3.65 2.28-4.2-1.85.315-3.932-.205-4.503-2.246C.28 6.737 0 3.12 0 2.632 0 .186 2.145.955 3.468 1.948"
                ></path>
              </svg>
            </a>
            <a
              class="social-link social-link--image"
              href="%%ROOMY_URL|attr%%"
              target="_blank"
              rel="noopener"
              aria-label="Aster ID on Roomy"
              title="Roomy"
            >
              <img src="uploads/roomy-favicon.png" alt="" width="64" height="64" />
            </a>
            <a class="social-link" href="mailto:%%CONTACT_EMAIL|attr%%" aria-label="Email Aster ID" title="Contact">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="2.5" y="5" width="19" height="14" rx="2"></rect>
                <path d="M3 6.5 12 13l9-6.5"></path>
              </svg>
            </a>
          </div>
        </footer>
      </div>
    </x-dc>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": %%SITE_NAME|json%%,
        "url": "%%DOMAIN%%",
        "logo": "%%DOMAIN%%uploads/og-image.png",
        "description": %%JSONLD_DESCRIPTION|json%%,
        "email": "%%CONTACT_EMAIL%%",
        "foundingDate": "%%FOUNDING_YEAR%%",
        "parentOrganization": { "@type": "Organization", "name": %%PARENT_ORG|json%% }
      }
    </script>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"heroTreatment":{"editor":"enum","options":["balanced","handle-first","type-only"],"default":"%%HERO_TREATMENT%%","tsType":"string","section":"Hero"},"cycleHandles":{"editor":"boolean","default":true,"tsType":"boolean","section":"Hero"}}'
    >
      /* ───── handles come from content.md; signup submits to Leaflet via the form ───── */
      const HANDLES = %%HANDLES|json%%;
      const HANDLE_WIDTH = Math.max(0, ...HANDLES.map(handle => handle.length));

      class Component extends DCLogic {
        state = { idx: 0, fading: false, email: "", error: "" };

        componentDidMount() {
          this.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          this.start();
        }
        componentWillUnmount() { this.stop(); }

        start() {
          const on = this.props.cycleHandles ?? true;
          if (this.reduced || !on || this.timer) return;
          // one clock: fade out, swap text while invisible, fade back in
          this.timer = setInterval(() => {
            this.setState({ fading: true });
            this.swapTimer = setTimeout(() => {
              this.setState(s => ({ idx: (s.idx + 1) % HANDLES.length, fading: false }));
            }, 620);
          }, 3200);
        }
        stop() {
          clearInterval(this.timer); this.timer = null;
          clearTimeout(this.swapTimer);
          if (this.state.fading) this.setState({ fading: false });
        }

        submit(e) {
          const email = (this.state.email || "").trim();
          if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) {
            e.preventDefault();
            this.setState({ error: email ? %%ERROR_INVALID|json%% : %%ERROR_EMPTY|json%% });
            return;
          }
          // Valid: let the GET form submit to Leaflet, which sends a confirmation link.
          this.setState({ error: "" });
        }

        renderVals() {
          const t = this.props.heroTreatment ?? "%%HERO_TREATMENT%%";
          return {
            isBalanced: t === "balanced",
            isHandleFirst: t === "handle-first",
            isTypeOnly: t === "type-only",
            handleName: HANDLES[this.state.idx],
            handleStyle: { width: `${HANDLE_WIDTH}ch`, opacity: this.state.fading ? 0 : 1, transition: "opacity 600ms ease-in-out" },
            email: this.state.email,
            error: this.state.error,
            invalid: !!this.state.error,
            onEmailChange: e => this.setState({ email: e.target.value, error: "" }),
            onSubmit: e => this.submit(e),
            pauseCycle: () => this.stop(),
            resumeCycle: () => this.start()
          };
        }
      }
    </script>
  </body>
</html>
